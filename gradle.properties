# --- gradle ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m
# Не публикуем KMP-библиотеки наружу, поэтому лишние варианты не нужны.
kotlin.mpp.enableCInteropCommonization=true
# iOS-таргеты объявляются только на macOS (см. gymhelper.kmp.library).
# Раскомментируй, чтобы форсировать их на другом хосте — но учти, что
# Kotlin/Native для Apple всё равно линкуется только на Mac.
# gymhelper.iosTargets=true
kotlin.native.ignoreDisabledTargets=true

# --- android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
