name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build & test (Android + common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Assemble debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Common + Android unit tests
        run: ./gradlew allTests --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gym-helper-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

# iOS-джоб появится, когда будет чем проверить результат локально:
# гонять macos-раннер вслепую и чинить его по логам — дороже, чем польза.
